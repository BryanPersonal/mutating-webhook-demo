apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutating-webhook-demo
  namespace: mutating-webhook-demo
  labels:
    app: mutating-webhook-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mutating-webhook-demo
  template:
    metadata:
      labels:
        app: mutating-webhook-demo
    spec:
      serviceAccountName: mutating-webhook-demo
      containers:
        - name: webhook
          image: mutating-webhook-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9443
              name: https
            - containerPort: 8081
              name: health
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INSTALL_WEBHOOK_CONFIG
              value: "1"
          volumeMounts:
            - name: cert-dir
              mountPath: /etc/webhook-certs
              readOnly: false
      volumes:
        - name: cert-dir
          emptyDir: {}
